services:
  viora.api:
    image: ${DOCKER_REGISTRY:-}vioraapi
    build:
      context: .
      dockerfile: Viora.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=sql,1433;Database=Viora;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Expiration_Minutes=${JWT_EXPIRATION_MINUTES}
      - RefreshToken__Secret=${REFRESH_TOKEN__SECRET}
      - RefreshToken__Expiry_Days=${REFRESH_TOKEN__EXPIRY_DAYS}
      - AiRag__Groq__ApiKey=${GROQ_API_KEY}
      - AiRag__Groq__ChatModel=${GROQ_MODEL}
      - AiRag__Groq__ClassificationModel=${GROQ_MODEL}
      - AiRag__Qdrant__Host=qdrant
      - AiRag__Qdrant__Port=6334
      - AiRag__Onnx__ModelPath=Models/all-MiniLM-L6-V2/model.onnx
      - AiRag__Onnx__VocabPath=Models/all-MiniLM-L6-V2/vocab.txt
      # Override the Seq sink's serverUrl (3rd entry, index 2, in Serilog:WriteTo) to reach the seq container.
      - Serilog__WriteTo__2__Args__serverUrl=http://seq:80
      - Payment__Secret=${PAYMENT__SECRET}
    depends_on:
      sql:
        condition: service_healthy
      qdrant:
        condition: service_started
      seq:
        condition: service_started
    restart: unless-stopped
    networks:
      - viora-net

  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - viora-net
    
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - viora-net

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true   # dev only: skip the admin-login requirement
    ports:
      - "5341:80"     # UI + ingestion (browse logs at http://localhost:5341)
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - viora-net

volumes:
  sql-data:
  qdrant-data:
  seq-data:

networks:
  viora-net: